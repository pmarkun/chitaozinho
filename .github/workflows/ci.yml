name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Scan dependencies, secrets and infrastructure
        run: nix develop --command ./scripts/security-audit

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Install locked dependencies
        run: |
          nix develop --command uv sync --all-packages --frozen
          nix develop --command pnpm install --frozen-lockfile
      - name: Reject unversioned protocol changes
        if: github.event_name == 'pull_request'
        run: nix develop --command ./scripts/check-protocol-compatibility "origin/${GITHUB_BASE_REF}"
      - name: Check TypeScript, Python, Rust and infrastructure
        run: nix develop --command ./scripts/check
      - name: Smoke PostgreSQL and Garage persistence
        shell: bash
        run: |
          nix develop --command bash -lc '
            set -euo pipefail
            trap "./scripts/local-services stop" EXIT
            ./scripts/local-services start
            ./scripts/test-service-integration
            CHITAOZINHO_BACKUP_SYNTHETIC=1 \
              ./scripts/test-postgres-backup-restore
          '

  oci-reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Build the production image reproducibly
        run: nix develop --command ./scripts/check-oci-reproducibility

  verifier-reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Build the verifier twice reproducibly
        run: nix develop --command ./scripts/check-verifier-reproducibility
