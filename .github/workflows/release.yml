name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6
      - name: Install locked JavaScript dependencies
        run: nix develop --command pnpm install --frozen-lockfile
      - name: Build release artifacts and SPDX SBOMs
        env:
          CHITAOZINHO_API_BASE_URL: https://api-staging-db23.up.railway.app
          CHITAOZINHO_VERIFIER_URL: https://verifier-web-staging.up.railway.app/validar
          CHITAOZINHO_ENVIRONMENT: beta
        run: nix develop --command ./scripts/build-release-artifacts dist/release
      - name: Sign every release artifact with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            find dist/release -maxdepth 1 -type f \
              ! -name '*.sigstore.json' -print | sort
          )
          for asset in "${assets[@]}"; do
            nix develop --command cosign sign-blob \
              --yes \
              --bundle "${asset}.sigstore.json" \
              "${asset}"
          done
      - name: Publish immutable tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "Chitãozinho ${GITHUB_REF_NAME}" \
            dist/release/*
