[project]
name = "chitaozinho-api"
version = "0.1.0"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
  "chitaozinho-protocol",
  "fastapi>=0.116.1",
  "pydantic-settings>=2.10.1",
  "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.1",
]

[tool.uv.sources]
chitaozinho-protocol = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chitaozinho_api"]
