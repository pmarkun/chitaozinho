[workspace]
resolver = "2"
members = [
  "apps/verifier-cli",
  "packages/protocol-rs",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.2", features = ["pkcs8"] }
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_jcs = "0.1"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
walkdir = "2.5"
zip = { version = "4.3", default-features = false, features = ["deflate"] }
mime_guess = "2.0"
